<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>五子棋 · AI 对战</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0f0c0a;
  --bg2:#1a1410;
  --bg3:#231c14;
  --accent:#c9a96e;
  --accent2:#e8c87a;
  --accent-glow:rgba(201,169,110,.35);
  --text:#e8d5b7;
  --muted:#8b7355;
  --border:rgba(201,169,110,.18);
  --ai-cyan:#22d3ee;
  --ai-purple:#a78bfa;
  --win-gold:#ffd700;
}
body{
  font-family:'Noto Serif SC','Songti SC',serif;
  background:
    radial-gradient(ellipse 80% 50% at 15% 10%,rgba(201,169,110,.12) 0%,transparent 50%),
    radial-gradient(ellipse 60% 40% at 85% 90%,rgba(34,211,238,.06) 0%,transparent 45%),
    radial-gradient(ellipse 50% 30% at 50% 50%,rgba(70,45,20,.2) 0%,transparent 60%),
    var(--bg);
  color:var(--text);
  min-height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  overflow-x:hidden;
  position:relative;
}

/* Floating ambient particles */
.ambient{
  position:fixed;inset:0;pointer-events:none;z-index:0;overflow:hidden;
}
.ambient span{
  position:absolute;width:3px;height:3px;border-radius:50%;
  background:var(--accent);opacity:.25;
  animation:drift linear infinite;
}
@keyframes drift{
  0%{transform:translateY(100vh) scale(.4);opacity:0}
  15%{opacity:.3}
  85%{opacity:.15}
  100%{transform:translateY(-10vh) scale(1);opacity:0}
}

.container{
  position:relative;z-index:2;
  display:flex;flex-direction:column;align-items:center;
  padding:14px;gap:12px;max-width:100%;
}

header{text-align:center;animation:fadeDown .7s ease}
@keyframes fadeDown{from{opacity:0;transform:translateY(-18px)}to{opacity:1;transform:none}}

.ai-badge{
  display:inline-flex;align-items:center;gap:7px;
  padding:5px 12px;margin-bottom:10px;border-radius:999px;
  background:linear-gradient(135deg,rgba(34,211,238,.15),rgba(167,139,250,.12));
  border:1px solid rgba(34,211,238,.3);
  font-size:11px;font-weight:600;letter-spacing:.06em;color:#a5f3fc;
  animation:badgePulse 2.8s ease-in-out infinite;
}
.ai-badge .dot{
  width:6px;height:6px;border-radius:50%;
  background:var(--ai-cyan);box-shadow:0 0 8px var(--ai-cyan);
  animation:blink 1.5s ease-in-out infinite;
}
@keyframes badgePulse{
  0%,100%{box-shadow:0 0 10px rgba(34,211,238,.15)}
  50%{box-shadow:0 0 18px rgba(34,211,238,.35)}
}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.4}}

h1{
  font-size:clamp(26px,5vw,38px);font-weight:700;
  color:var(--accent);letter-spacing:8px;
  text-shadow:0 2px 16px rgba(201,169,110,.3);
}
.sub{
  font-family:'Cormorant Garamond',serif;font-size:13px;
  color:var(--muted);letter-spacing:5px;text-transform:uppercase;margin-top:2px;
}

/* Status bar */
.bar{
  display:flex;align-items:center;gap:14px;
  background:rgba(35,28,20,.85);border:1px solid var(--border);
  border-radius:14px;padding:8px 16px;
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);
  animation:fadeDown .7s ease .12s both;
  box-shadow:0 4px 20px rgba(0,0,0,.25);
}
.pc{
  display:flex;align-items:center;gap:7px;
  padding:5px 12px;border-radius:10px;
  transition:all .35s cubic-bezier(.22,1,.36,1);opacity:.4;
}
.pc.on{
  opacity:1;
  background:rgba(201,169,110,.12);
  box-shadow:0 0 16px rgba(201,169,110,.15);
}
.pc.ai-on{
  opacity:1;
  background:rgba(34,211,238,.1);
  box-shadow:0 0 16px rgba(34,211,238,.18);
  border:1px solid rgba(34,211,238,.2);
}
.si{width:18px;height:18px;border-radius:50%;flex-shrink:0}
.si.b{
  background:radial-gradient(circle at 35% 35%,#555,#111);
  box-shadow:1px 1px 3px rgba(0,0,0,.5),0 0 0 1px rgba(255,255,255,.05);
}
.si.w{
  background:radial-gradient(circle at 35% 35%,#fff,#ddd);
  box-shadow:1px 1px 3px rgba(0,0,0,.25),0 0 8px rgba(34,211,238,.2);
}
.pc span{font-size:13px;white-space:nowrap}
.st{
  font-size:14px;color:var(--accent2);min-width:100px;text-align:center;
  transition:opacity .3s,color .3s;
}
.st.think{
  color:var(--ai-cyan);
  animation:thinkPulse 1.1s ease-in-out infinite;
}
@keyframes thinkPulse{0%,100%{opacity:1}50%{opacity:.4}}

/* Difficulty selector */
.diff-bar{
  display:flex;align-items:center;gap:6px;
  animation:fadeDown .7s ease .18s both;
}
.diff-bar label{font-size:12px;color:var(--muted);margin-right:4px}
.diff-btn{
  font-family:inherit;font-size:12px;padding:5px 12px;
  border:1px solid var(--border);border-radius:8px;
  background:var(--bg3);color:var(--muted);cursor:pointer;
  transition:all .2s;
}
.diff-btn:hover{border-color:var(--accent);color:var(--accent)}
.diff-btn.active{
  background:rgba(201,169,110,.15);border-color:var(--accent);
  color:var(--accent2);box-shadow:0 0 10px rgba(201,169,110,.2);
}

/* Board */
.bw{
  position:relative;border-radius:10px;
  box-shadow:
    0 20px 60px rgba(0,0,0,.55),
    0 4px 16px rgba(0,0,0,.3),
    0 0 0 1px rgba(201,169,110,.08);
  animation:fadeDown .7s ease .22s both;
}
.bw.thinking-glow{
  box-shadow:
    0 20px 60px rgba(0,0,0,.55),
    0 0 30px rgba(34,211,238,.15),
    0 0 0 1px rgba(34,211,238,.2);
  transition:box-shadow .4s ease;
}
canvas{display:block;border-radius:10px;cursor:default;touch-action:none}

/* Move counter */
.move-info{
  font-size:12px;color:var(--muted);letter-spacing:.03em;
  animation:fadeDown .7s ease .28s both;
}
.move-info strong{color:var(--accent);font-weight:600}

/* Controls */
.ctrls{
  display:flex;gap:10px;flex-wrap:wrap;justify-content:center;
  animation:fadeDown .7s ease .32s both;
}
.btn{
  font-family:'Noto Serif SC',serif;font-size:13px;
  padding:9px 18px;border:1px solid var(--border);border-radius:10px;
  background:rgba(35,28,20,.9);color:var(--text);cursor:pointer;
  transition:all .2s;display:flex;align-items:center;gap:5px;
  backdrop-filter:blur(6px);
}
.btn:hover{
  background:rgba(201,169,110,.14);border-color:var(--accent);color:var(--accent);
  box-shadow:0 4px 14px rgba(201,169,110,.12);
}
.btn:active{transform:scale(.96)}
.btn:disabled{opacity:.4;cursor:not-allowed;pointer-events:none}
.btn svg{width:15px;height:15px;fill:currentColor}

/* Modal */
.mo{
  position:fixed;inset:0;background:rgba(0,0,0,.75);
  display:flex;justify-content:center;align-items:center;
  opacity:0;pointer-events:none;transition:opacity .45s;z-index:100;
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);
}
.mo.show{opacity:1;pointer-events:auto}
.mc{
  background:linear-gradient(160deg,var(--bg3) 0%,#1e1812 100%);
  border:1px solid var(--accent);border-radius:20px;
  padding:36px 44px;text-align:center;position:relative;overflow:hidden;
  transform:scale(.82) translateY(24px);
  transition:transform .5s cubic-bezier(.34,1.56,.64,1);
  box-shadow:0 24px 60px rgba(0,0,0,.5),0 0 40px rgba(201,169,110,.1);
}
.mo.show .mc{transform:scale(1) translateY(0)}
.mc::before{
  content:"";position:absolute;top:-50%;left:-50%;width:200%;height:200%;
  background:radial-gradient(circle at 50% 30%,rgba(201,169,110,.08),transparent 50%);
  pointer-events:none;
}
.mc .ic{font-size:52px;margin-bottom:12px;position:relative;z-index:1;
  animation:iconPop .5s cubic-bezier(.34,1.56,.64,1) .15s both}
@keyframes iconPop{from{transform:scale(0);opacity:0}to{transform:scale(1);opacity:1}}
.mc h2{font-size:26px;color:var(--accent);margin-bottom:6px;position:relative;z-index:1}
.mc p{font-size:15px;color:var(--muted);margin-bottom:20px;position:relative;z-index:1}
.mc .stats{font-size:13px;color:var(--muted);margin-bottom:18px;position:relative;z-index:1}
.mc .stats span{color:var(--accent2)}
.mc .btn{margin:0 auto;padding:11px 28px;font-size:15px;position:relative;z-index:1}

/* AI thinking indicator overlay */
.ai-think-hint{
  position:absolute;top:10px;left:50%;transform:translateX(-50%);
  background:rgba(15,23,42,.8);border:1px solid rgba(34,211,238,.35);
  color:#a5f3fc;font-size:11px;padding:4px 12px;border-radius:999px;
  opacity:0;pointer-events:none;transition:opacity .3s;
  letter-spacing:.04em;z-index:5;white-space:nowrap;
  box-shadow:0 0 16px rgba(34,211,238,.2);
}
.ai-think-hint.show{opacity:1}

@media(max-width:500px){
  .bar{gap:6px;padding:6px 10px}
  .pc span{font-size:11px}
  .st{font-size:12px;min-width:72px}
  .btn{padding:7px 12px;font-size:12px}
  .mc{padding:28px 26px}
  .mc h2{font-size:22px}
  .diff-btn{padding:4px 10px;font-size:11px}
}
@media(prefers-reduced-motion:reduce){
  .ambient span,.ai-badge,.ai-badge .dot,.st.think{animation:none!important}
}
</style>
</head>
<body>
<div class="ambient" id="ambient" aria-hidden="true"></div>

<div class="container">
  <header>
    <div class="ai-badge"><span class="dot"></span> AI 智能对战</div>
    <h1>五 子 棋</h1>
    <p class="sub">Gomoku · vs AI</p>
  </header>

  <div class="bar">
    <div class="pc on" id="ch"><div class="si b"></div><span>黑棋 · 你</span></div>
    <div class="st" id="st">请落子</div>
    <div class="pc" id="ca"><div class="si w"></div><span>白棋 · AI</span></div>
  </div>

  <div class="diff-bar">
    <label>难度</label>
    <button class="diff-btn" data-diff="easy">简单</button>
    <button class="diff-btn active" data-diff="medium">中等</button>
    <button class="diff-btn" data-diff="hard">困难</button>
  </div>

  <div class="bw" id="bw">
    <div class="ai-think-hint" id="thinkHint">AI 思考中…</div>
    <canvas id="cv"></canvas>
  </div>

  <div class="move-info">手数 <strong id="moveCount">0</strong> · 难度 <strong id="diffLabel">中等</strong></div>

  <div class="ctrls">
    <button class="btn" id="bu" title="悔棋">
      <svg viewBox="0 0 24 24"><path d="M12.5 8c-2.65 0-5.05.99-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/></svg>
      悔棋
    </button>
    <button class="btn" id="br" title="重新开始">
      <svg viewBox="0 0 24 24"><path d="M17.65 6.35A8 8 0 1012 4a7.96 7.96 0 00-5.65 2.35L2 2v6h6L5.22 5.22A6 6 0 1112 18a5.96 5.96 0 01-4.22-1.78L12 12V4c1.66 0 3.14.69 4.22 1.78L18.36 3.65 17.65 6.35z"/></svg>
      重新开始
    </button>
  </div>
</div>

<div class="mo" id="mo">
  <div class="mc">
    <div class="ic" id="mi"></div>
    <h2 id="mt"></h2>
    <p id="mp"></p>
    <div class="stats" id="ms"></div>
    <button class="btn" id="mr">再来一局</button>
  </div>
</div>

<script>
// ============ CONSTANTS ============
const N=15,HUMAN=1,AI=2,EMPTY=0;
const DIFF={
  easy:{depth:1,noise:.35,label:'简单'},
  medium:{depth:2,noise:.12,label:'中等'},
  hard:{depth:3,noise:.02,label:'困难'}
};

// ============ STATE ============
let board,cur,over,hist,win,last,hover,thinking;
let cv,ctx,cpad,csz,bpx,wood,birth,parts,wglow;
let difficulty='medium',moveCount=0;

// ============ INIT ============
function init(){
  cv=document.getElementById('cv');
  sizing();makeWood();reset();
  bind();spawnAmbient();loop();
}

function sizing(){
  const mx=Math.min(innerWidth-16,innerHeight-280,620);
  cpad=Math.max(18,mx*.055);
  csz=Math.floor((mx-cpad*2)/(N-1));
  bpx=csz*(N-1)+cpad*2;
  const d=devicePixelRatio||1;
  cv.width=bpx*d;cv.height=bpx*d;
  cv.style.width=bpx+'px';cv.style.height=bpx+'px';
  ctx=cv.getContext('2d');ctx.scale(d,d);
}

function reset(){
  board=Array.from({length:N},()=>Array(N).fill(EMPTY));
  cur=HUMAN;over=false;hist=[];win=null;last=null;
  hover=null;thinking=false;moveCount=0;
  birth=new Map();parts=[];wglow=0;
  ui();hideModal();updateMoveInfo();
  document.getElementById('bw').classList.remove('thinking-glow');
  document.getElementById('thinkHint').classList.remove('show');
}

function spawnAmbient(){
  const el=document.getElementById('ambient');
  for(let i=0;i<14;i++){
    const s=document.createElement('span');
    const sz=2+Math.random()*3;
    s.style.width=sz+'px';s.style.height=sz+'px';
    s.style.left=Math.random()*100+'%';
    s.style.animationDuration=(10+Math.random()*16)+'s';
    s.style.animationDelay=(Math.random()*12)+'s';
    s.style.background=Math.random()>.5?'#c9a96e':'#22d3ee';
    s.style.opacity=.15+Math.random()*.2;
    el.appendChild(s);
  }
}

// ============ WOOD TEXTURE ============
function makeWood(){
  const w=bpx-cpad*2,o=document.createElement('canvas');
  o.width=w*2;o.height=w*2;
  const c=o.getContext('2d');c.scale(2,2);
  c.fillStyle='#DEB887';c.fillRect(0,0,w,w);
  for(let i=0;i<280;i++){
    const y=Math.random()*w;
    c.strokeStyle=`rgba(${120+Math.random()*50|0},${80+Math.random()*40|0},${30+Math.random()*30|0},${(.02+Math.random()*.06).toFixed(3)})`;
    c.lineWidth=.3+Math.random()*2.2;c.beginPath();let py=y;
    for(let x=0;x<=w;x+=3){py=y+Math.sin(x*.004+i*.3)*(2+Math.random()*4);x===0?c.moveTo(x,py):c.lineTo(x,py)}
    c.stroke();
  }
  for(let i=0;i<3;i++){
    const kx=40+Math.random()*(w-80),ky=40+Math.random()*(w-80),kr=6+Math.random()*18;
    const g=c.createRadialGradient(kx,ky,0,kx,ky,kr);
    g.addColorStop(0,'rgba(139,90,43,.12)');g.addColorStop(1,'rgba(139,90,43,0)');
    c.fillStyle=g;c.beginPath();c.arc(kx,ky,kr,0,Math.PI*2);c.fill();
  }
  wood=o;
}

// ============ DRAWING ============
function render(){
  ctx.clearRect(0,0,bpx,bpx);
  drawBg();drawGrid();drawStars();drawCoords();drawHover();
  drawStones();drawLast();drawWin();drawParts();
}

function drawBg(){
  const f=8;
  const fg=ctx.createLinearGradient(0,0,bpx,bpx);
  fg.addColorStop(0,'#7B5B3A');fg.addColorStop(.5,'#6B4C2E');fg.addColorStop(1,'#5B3D22');
  ctx.fillStyle=fg;rr(ctx,0,0,bpx,bpx,8);ctx.fill();
  ctx.strokeStyle='rgba(255,255,255,.07)';ctx.lineWidth=1;rr(ctx,.5,.5,bpx-1,bpx-1,8);ctx.stroke();
  ctx.fillStyle='#DEB887';ctx.fillRect(f,f,bpx-f*2,bpx-f*2);
  if(wood){ctx.save();ctx.globalAlpha=.32;ctx.drawImage(wood,f,f,bpx-f*2,bpx-f*2);ctx.restore()}
  ctx.save();ctx.beginPath();ctx.rect(f,f,bpx-f*2,bpx-f*2);ctx.clip();
  let g=ctx.createLinearGradient(f,f,f,f+14);
  g.addColorStop(0,'rgba(0,0,0,.07)');g.addColorStop(1,'transparent');
  ctx.fillStyle=g;ctx.fillRect(f,f,bpx-f*2,14);
  g=ctx.createLinearGradient(f,f,f+14,f);
  g.addColorStop(0,'rgba(0,0,0,.05)');g.addColorStop(1,'transparent');
  ctx.fillStyle=g;ctx.fillRect(f,f,14,bpx-f*2);
  g=ctx.createRadialGradient(bpx*.32,bpx*.32,0,bpx*.5,bpx*.5,bpx*.7);
  g.addColorStop(0,'rgba(255,255,255,.04)');g.addColorStop(1,'rgba(0,0,0,.02)');
  ctx.fillStyle=g;ctx.fillRect(f,f,bpx-f*2,bpx-f*2);
  ctx.restore();
}

function drawGrid(){
  const s=cpad,e=cpad+(N-1)*csz;
  ctx.strokeStyle='rgba(100,70,20,.5)';ctx.lineWidth=1;
  for(let i=0;i<N;i++){
    const p=cpad+i*csz;
    ctx.beginPath();ctx.moveTo(s,p);ctx.lineTo(e,p);ctx.stroke();
    ctx.beginPath();ctx.moveTo(p,s);ctx.lineTo(p,e);ctx.stroke();
  }
  ctx.strokeStyle='rgba(100,70,20,.65)';ctx.lineWidth=1.5;
  ctx.strokeRect(s,s,(N-1)*csz,(N-1)*csz);
}

function drawStars(){
  const pts=[[3,3],[3,7],[3,11],[7,3],[7,7],[7,11],[11,3],[11,7],[11,11]];
  ctx.fillStyle='rgba(100,70,20,.65)';
  for(const[r,c]of pts){ctx.beginPath();ctx.arc(cpad+c*csz,cpad+r*csz,csz*.12,0,Math.PI*2);ctx.fill()}
}

function drawCoords(){
  const fs=Math.max(9,Math.min(12,csz*.34));
  ctx.font=`600 ${fs}px 'Cormorant Garamond',serif`;
  ctx.fillStyle='rgba(100,70,20,.35)';ctx.textAlign='center';ctx.textBaseline='middle';
  const L='ABCDEFGHIJKLMNO';
  for(let i=0;i<N;i++){
    const p=cpad+i*csz;
    ctx.fillText(L[i],p,cpad*.38);ctx.fillText(L[i],p,bpx-cpad*.38);
    ctx.fillText(''+(i+1),cpad*.32,p);ctx.fillText(''+(i+1),bpx-cpad*.32,p);
  }
}

function drawHover(){
  if(!hover||over||thinking||cur!==HUMAN)return;
  if(board[hover.r][hover.c]!==EMPTY)return;
  ctx.save();ctx.globalAlpha=.28;
  stone(cpad+hover.c*csz,cpad+hover.r*csz,csz*.42,HUMAN);
  ctx.restore();
  // soft ring
  ctx.beginPath();
  ctx.arc(cpad+hover.c*csz,cpad+hover.r*csz,csz*.48,0,Math.PI*2);
  ctx.strokeStyle='rgba(201,169,110,.25)';ctx.lineWidth=1.5;ctx.stroke();
}

function drawStones(){
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    if(board[r][c]===EMPTY)continue;
    const sc=gscale(r,c),rd=csz*.42*sc;
    if(rd>.4)stone(cpad+c*csz,cpad+r*csz,rd,board[r][c]);
  }
}

function stone(cx,cy,r,p){
  if(r<.4)return;
  ctx.beginPath();ctx.arc(cx+r*.08,cy+r*.12,r*1.02,0,Math.PI*2);
  ctx.fillStyle=p===HUMAN?'rgba(0,0,0,.32)':'rgba(0,0,0,.22)';ctx.fill();
  if(p===HUMAN){
    let g=ctx.createRadialGradient(cx-r*.3,cy-r*.3,r*.05,cx,cy,r);
    g.addColorStop(0,'#4a4a4a');g.addColorStop(.3,'#2a2a2a');g.addColorStop(.7,'#1a1a1a');g.addColorStop(1,'#0a0a0a');
    ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();
    let rm=ctx.createRadialGradient(cx,cy,r*.8,cx,cy,r);
    rm.addColorStop(0,'rgba(255,255,255,0)');rm.addColorStop(1,'rgba(255,255,255,.06)');
    ctx.fillStyle=rm;ctx.fill();
    let h=ctx.createRadialGradient(cx-r*.3,cy-r*.35,0,cx-r*.3,cy-r*.35,r*.5);
    h.addColorStop(0,'rgba(255,255,255,.32)');h.addColorStop(.5,'rgba(255,255,255,.08)');h.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=h;ctx.fill();
  }else{
    let g=ctx.createRadialGradient(cx-r*.3,cy-r*.3,r*.05,cx,cy,r);
    g.addColorStop(0,'#ffffff');g.addColorStop(.4,'#f8f8f8');g.addColorStop(.8,'#e8e8e8');g.addColorStop(1,'#d0d0d0');
    ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);ctx.fillStyle=g;ctx.fill();
    ctx.strokeStyle='rgba(0,0,0,.1)';ctx.lineWidth=.7;ctx.stroke();
    // AI cyan rim hint
    ctx.beginPath();ctx.arc(cx,cy,r,0,Math.PI*2);
    ctx.strokeStyle='rgba(34,211,238,.15)';ctx.lineWidth=1.2;ctx.stroke();
    let h=ctx.createRadialGradient(cx-r*.3,cy-r*.35,0,cx-r*.3,cy-r*.35,r*.45);
    h.addColorStop(0,'rgba(255,255,255,.82)');h.addColorStop(.5,'rgba(255,255,255,.25)');h.addColorStop(1,'rgba(255,255,255,0)');
    ctx.fillStyle=h;ctx.fill();
  }
}

function drawLast(){
  if(!last)return;
  const x=cpad+last.c*csz,y=cpad+last.r*csz,r=csz*.09;
  ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);
  ctx.fillStyle=board[last.r][last.c]===HUMAN?'rgba(255,255,255,.65)':'rgba(34,211,238,.7)';ctx.fill();
}

function drawWin(){
  if(!win||!over)return;
  wglow+=.06;const a=.25+Math.sin(wglow)*.18;
  for(const[r,c]of win){
    const x=cpad+c*csz,y=cpad+r*csz;
    const g=ctx.createRadialGradient(x,y,0,x,y,csz*.65);
    g.addColorStop(0,`rgba(255,215,0,${a})`);g.addColorStop(1,'rgba(255,215,0,0)');
    ctx.fillStyle=g;ctx.beginPath();ctx.arc(x,y,csz*.65,0,Math.PI*2);ctx.fill();
  }
  // connecting line
  if(win.length>=2){
    const sorted=win.slice().sort((a,b)=>a[0]-b[0]||a[1]-b[1]);
    ctx.beginPath();
    ctx.moveTo(cpad+sorted[0][1]*csz,cpad+sorted[0][0]*csz);
    for(let i=1;i<sorted.length;i++)ctx.lineTo(cpad+sorted[i][1]*csz,cpad+sorted[i][0]*csz);
    ctx.strokeStyle=`rgba(255,215,0,${.35+Math.sin(wglow)*.2})`;
    ctx.lineWidth=3;ctx.lineCap='round';ctx.stroke();
  }
}

function drawParts(){
  for(const p of parts){
    ctx.save();ctx.globalAlpha=p.life;ctx.fillStyle=p.col;
    ctx.beginPath();ctx.arc(p.x,p.y,p.sz,0,Math.PI*2);ctx.fill();ctx.restore();
  }
}

function rr(c,x,y,w,h,r){
  c.beginPath();c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.quadraticCurveTo(x+w,y,x+w,y+r);
  c.lineTo(x+w,y+h-r);c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);
  c.lineTo(x+r,y+h);c.quadraticCurveTo(x,y+h,x,y+h-r);
  c.lineTo(x,y+r);c.quadraticCurveTo(x,y,x+r,y);c.closePath();
}

// ============ ANIMATION ============
function gscale(r,c){
  const k=r*N+c,b=birth.get(k);
  if(!b)return 1;
  const t=(performance.now()-b)/280;
  if(t>=1)return 1;
  const c1=1.70158;return 1+(c1+1)*Math.pow(t-1,3)+c1*Math.pow(t-1,2);
}

function updParts(){
  parts=parts.filter(p=>{
    p.x+=p.vx;p.y+=p.vy;p.vy+=.06;p.life-=p.dec;p.sz*=.992;
    return p.life>0;
  });
}

function spawnWin(){
  if(!win)return;
  for(const[r,c]of win){
    const x=cpad+c*csz,y=cpad+r*csz;
    for(let i=0;i<16;i++){
      const a=Math.random()*Math.PI*2,sp=1.2+Math.random()*4;
      parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-2.2,
        sz:2+Math.random()*4,life:1,dec:.008+Math.random()*.012,
        col:`hsl(${35+Math.random()*30},${75+Math.random()*20}%,${50+Math.random()*30}%)`});
    }
  }
}

function spawnPlace(r,c,isAI){
  const x=cpad+c*csz,y=cpad+r*csz;
  for(let i=0;i<6;i++){
    const a=Math.random()*Math.PI*2,sp=.5+Math.random()*1.8;
    parts.push({x,y,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-.5,
      sz:1.2+Math.random()*2,life:.7,dec:.025+Math.random()*.02,
      col:isAI?'rgba(34,211,238,.7)':'rgba(201,169,110,.6)'});
  }
}

// ============ GAME LOGIC ============
function place(r,c,p){
  board[r][c]=p;birth.set(r*N+c,performance.now());
  hist.push({r,c,p});last={r,c};moveCount++;
  spawnPlace(r,c,p===AI);updateMoveInfo();
}

function chkWin(r,c,p){
  const ds=[[0,1],[1,0],[1,1],[1,-1]];
  for(const[dr,dc]of ds){
    const cells=[[r,c]];
    let nr=r+dr,nc=c+dc;
    while(nr>=0&&nr<N&&nc>=0&&nc<N&&board[nr][nc]===p){cells.push([nr,nc]);nr+=dr;nc+=dc}
    nr=r-dr;nc=c-dc;
    while(nr>=0&&nr<N&&nc>=0&&nc<N&&board[nr][nc]===p){cells.push([nr,nc]);nr-=dr;nc-=dc}
    if(cells.length>=5)return cells;
  }
  return null;
}

function full(){
  for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(board[r][c]===EMPTY)return false;
  return true;
}

function humanMove(r,c){
  if(over||thinking||cur!==HUMAN||board[r][c]!==EMPTY)return;
  place(r,c,HUMAN);
  const w=chkWin(r,c,HUMAN);
  if(w){win=w;over=true;spawnWin();ui();setTimeout(()=>showModal('h'),1100);return}
  if(full()){over=true;ui();setTimeout(()=>showModal('d'),700);return}
  cur=AI;ui();doAI();
}

function doAI(){
  thinking=true;ui();
  document.getElementById('bw').classList.add('thinking-glow');
  document.getElementById('thinkHint').classList.add('show');
  const delay=280+Math.random()*280|0;
  setTimeout(()=>{
    const m=bestMove();
    if(!m){thinking=false;return}
    place(m[0],m[1],AI);
    const w=chkWin(m[0],m[1],AI);
    if(w){win=w;over=true;spawnWin();ui();setTimeout(()=>showModal('a'),1100);thinking=false;cleanupThink();return}
    if(full()){over=true;ui();setTimeout(()=>showModal('d'),700);thinking=false;cleanupThink();return}
    cur=HUMAN;thinking=false;ui();cleanupThink();
  },delay);
}

function cleanupThink(){
  document.getElementById('bw').classList.remove('thinking-glow');
  document.getElementById('thinkHint').classList.remove('show');
}

// ============ AI (with difficulty) ============
function bestMove(){
  const cands=getCands();
  if(!cands.length)return[7,7];
  const cfg=DIFF[difficulty]||DIFF.medium;
  let scored=[];
  for(const[r,c]of cands){
    const at=evalC(r,c,AI),df=evalC(r,c,HUMAN);
    let s;
    if(at>=1e5)s=1e7+at;
    else if(df>=1e5)s=5e6+df;
    else if(at>=5e4)s=1e6+at;
    else if(df>=5e4)s=5e5+df;
    else if(at>=5e3)s=1e5+at;
    else if(df>=5e3)s=5e4+df;
    else s=at*1.15+df;
    // noise by difficulty
    s+= (Math.random()-0.5)*cfg.noise*s;
    scored.push({r,c,s});
  }
  scored.sort((a,b)=>b.s-a.s);
  // pick among top few for easy/medium randomness
  const topN=difficulty==='easy'?Math.min(4,scored.length):difficulty==='medium'?Math.min(2,scored.length):1;
  const pick=scored[Math.floor(Math.random()*topN)];
  return[pick.r,pick.c];
}

function evalC(row,col,player){
  let tot=0,l3=0,d4=0;
  const ds=[[0,1],[1,0],[1,1],[1,-1]];
  board[row][col]=player;
  for(const[dr,dc]of ds){
    let cnt=1,r,c;
    r=row+dr;c=col+dc;
    while(r>=0&&r<N&&c>=0&&c<N&&board[r][c]===player){cnt++;r+=dr;c+=dc}
    const o1=r>=0&&r<N&&c>=0&&c<N&&board[r][c]===EMPTY;
    r=row-dr;c=col-dc;
    while(r>=0&&r<N&&c>=0&&c<N&&board[r][c]===player){cnt++;r-=dr;c-=dc}
    const o2=r>=0&&r<N&&c>=0&&c<N&&board[r][c]===EMPTY;
    const oe=(o1?1:0)+(o2?1:0);
    const sc=pscore(cnt,oe);tot+=sc;
    if(cnt===3&&oe===2)l3++;
    if(cnt===4&&oe===1)d4++;
  }
  board[row][col]=EMPTY;
  if(l3>=2)tot+=22000;
  if(d4>=2)tot+=30000;
  if(l3>=1&&d4>=1)tot+=26000;
  return tot;
}

function pscore(cnt,oe){
  if(cnt>=5)return 1e5;
  if(oe===0)return 0;
  if(cnt===4)return oe===2?5e4:5e3;
  if(cnt===3)return oe===2?5e3:500;
  if(cnt===2)return oe===2?500:50;
  if(cnt===1)return oe===2?10:3;
  return 0;
}

function getCands(){
  const s=new Set();
  for(let r=0;r<N;r++)for(let c=0;c<N;c++){
    if(board[r][c]!==EMPTY){
      for(let dr=-2;dr<=2;dr++)for(let dc=-2;dc<=2;dc++){
        const nr=r+dr,nc=c+dc;
        if(nr>=0&&nr<N&&nc>=0&&nc<N&&board[nr][nc]===EMPTY)s.add(nr*N+nc);
      }
    }
  }
  if(!s.size){if(board[7][7]===EMPTY)return[[7,7]];for(let r=0;r<N;r++)for(let c=0;c<N;c++)if(board[r][c]===EMPTY)s.add(r*N+c)}
  return Array.from(s).map(k=>[k/N|0,k%N]);
}

// ============ EVENTS ============
function bind(){
  cv.addEventListener('mousemove',e=>{
    const p=bpos(e.clientX,e.clientY);
    hover=p;
    cv.style.cursor=p&&!over&&!thinking&&cur===HUMAN&&board[p.r][p.c]===EMPTY?'pointer':'default';
  });
  cv.addEventListener('mouseleave',()=>{hover=null});
  cv.addEventListener('click',e=>{const p=bpos(e.clientX,e.clientY);if(p)humanMove(p.r,p.c)});
  cv.addEventListener('touchstart',e=>e.preventDefault(),{passive:false});
  cv.addEventListener('touchend',e=>{
    e.preventDefault();
    if(e.changedTouches.length){const t=e.changedTouches[0],p=bpos(t.clientX,t.clientY);if(p)humanMove(p.r,p.c)}
  },{passive:false});
  document.getElementById('bu').onclick=undo;
  document.getElementById('br').onclick=()=>{reset();makeWood()};
  document.getElementById('mr').onclick=()=>{reset();makeWood()};
  addEventListener('resize',()=>{sizing();makeWood()});

  // difficulty buttons
  document.querySelectorAll('.diff-btn').forEach(btn=>{
    btn.addEventListener('click',()=>{
      if(hist.length>0&&!confirm('切换难度将重新开始，确定吗？'))return;
      document.querySelectorAll('.diff-btn').forEach(b=>b.classList.remove('active'));
      btn.classList.add('active');
      difficulty=btn.dataset.diff;
      reset();makeWood();
      updateMoveInfo();
    });
  });
}

function bpos(cx,cy){
  const rect=cv.getBoundingClientRect();
  const x=cx-rect.left,y=cy-rect.top;
  const c=Math.round((x-cpad)/csz),r=Math.round((y-cpad)/csz);
  return r>=0&&r<N&&c>=0&&c<N?{r,c}:null;
}

// ============ UI ============
function ui(){
  const st=document.getElementById('st'),ch=document.getElementById('ch'),ca=document.getElementById('ca');
  ch.classList.toggle('on',cur===HUMAN&&!over);
  ca.classList.toggle('on',false);
  ca.classList.toggle('ai-on',cur===AI&&!over);
  if(over){st.textContent='游戏结束';st.classList.remove('think')}
  else if(thinking){st.textContent='AI 思考中…';st.classList.add('think')}
  else{st.textContent='请落子';st.classList.remove('think')}
  document.getElementById('bu').disabled=over||thinking||hist.length<2;
}

function updateMoveInfo(){
  document.getElementById('moveCount').textContent=moveCount;
  document.getElementById('diffLabel').textContent=(DIFF[difficulty]||DIFF.medium).label;
}

function showModal(r){
  const mo=document.getElementById('mo');
  document.getElementById('mi').textContent=r==='h'?'🏆':r==='a'?'🤖':'🤝';
  document.getElementById('mt').textContent=r==='h'?'恭喜获胜！':r==='a'?'AI 获胜': '平局';
  document.getElementById('mp').textContent=
    r==='h'?'你成功击败了 AI，棋艺精湛！':
    r==='a'?'AI 更胜一筹，再接再厉！':
    '棋逢对手，势均力敌';
  document.getElementById('ms').innerHTML=
    `本局手数 <span>${moveCount}</span> · 难度 <span>${(DIFF[difficulty]||DIFF.medium).label}</span>`;
  mo.classList.add('show');
}
function hideModal(){document.getElementById('mo').classList.remove('show')}

function undo(){
  if(over||thinking||hist.length<2)return;
  const a=hist.pop();board[a.r][a.c]=EMPTY;birth.delete(a.r*N+a.c);moveCount--;
  const h=hist.pop();board[h.r][h.c]=EMPTY;birth.delete(h.r*N+h.c);moveCount--;
  cur=HUMAN;last=hist.length?hist[hist.length-1]:null;ui();updateMoveInfo();
}

// ============ LOOP ============
function loop(){updParts();render();requestAnimationFrame(loop)}

// ============ START ============
init();
</script>
